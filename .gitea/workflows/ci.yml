name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, Lint, Typecheck, Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install toolchain
        run: mise install

      - name: Install pnpm
        run: |
          mise exec -- corepack enable
          mise exec -- corepack prepare pnpm@11 --activate

      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate (build, lint, typecheck, test)
        run: mise exec -- pnpm run ci
