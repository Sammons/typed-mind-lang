name: Deploy Static Site

on:
  push:
    branches:
      - main
    paths:
      - 'lib/typed-mind-static-website/**'
      - 'lib/typed-mind/**'
      - 'lib/typed-mind-cli/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.gitea/workflows/deploy-static-site.yml'
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install toolchain
        run: mise install

      - name: Install pnpm
        run: |
          mise exec -- corepack enable
          mise exec -- corepack prepare pnpm@11 --activate

      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile --ignore-scripts

      - name: Build packages
        run: |
          mise exec -- pnpm --dir lib/typed-mind build
          mise exec -- pnpm --dir lib/typed-mind-cli build

      - name: Build site
        run: cd lib/typed-mind-static-website && mise exec -- node build.js

      - name: Build grammar wasm
        # RFC-TM-1 (rfc-tm-1-diamond.md) leaf L6. Guards on the frozen grammar path
        # (lib/typed-mind/grammar/) established in the Diamond Doc; TM-2 activates this step
        # by creating that directory, with no further workflow edit.
        run: |
          if [ ! -d "lib/typed-mind/grammar/" ]; then
            echo "lib/typed-mind/grammar/ absent — skipping wasm build (dormant until RFC-TM-2)"
            exit 0
          fi
          cd lib/typed-mind/grammar
          # TM-1 defect fix (found in TM-2 Q0): without this env the CLI falls back to
          # its unverified wasi-sdk downloader instead of the mise-pinned, checksummed SDK.
          TREE_SITTER_WASI_SDK_PATH="$(mise where http:wasi-sdk)" mise exec -- tree-sitter build --wasm
          cp *.wasm ../../typed-mind-static-website/dist/

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          cd lib/typed-mind-static-website
          mise exec -- node node_modules/wrangler/bin/wrangler.js pages deploy dist --project-name=typedmind --branch=main --commit-dirty=true
