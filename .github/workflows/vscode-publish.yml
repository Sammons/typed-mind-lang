name: Publish VS Code Extension

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual publishing)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      prerelease:
        description: 'Publish as pre-release'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

# Prevent concurrent publishing
concurrency:
  group: vscode-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate Extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Get version
        id: version
        run: |
          VERSION=$(jq -r '.version' lib/typed-mind-vscode-extension/package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extension version: $VERSION"

      - name: Check if should publish
        id: check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          EXTENSION_ID="sammons.typed-mind"
          
          echo "Checking if $EXTENSION_ID@$VERSION exists on marketplace..."
          
          # Check if version already exists
          if mise exec -- pnpm --filter typed-mind exec vsce show "$EXTENSION_ID" --json 2>/dev/null | jq -e ".versions[] | select(.version == \"$VERSION\")" > /dev/null 2>&1; then
            echo "Version $VERSION already exists on marketplace"
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "Version $VERSION not found on marketplace, will publish"
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

      - name: Validate extension
        run: |
          cd lib/typed-mind-vscode-extension
          
          # Check required files exist
          for file in package.json README.md CHANGELOG.md; do
            if [ ! -f "$file" ]; then
              echo "Error: Required file $file not found"
              exit 1
            fi
          done
          
          # Validate package.json
          mise exec -- pnpm --filter typed-mind exec vsce ls --no-dependencies
          
          cd ../..

  build:
    name: Build Extension
    needs: validate
    if: needs.validate.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      # RFC-TM-7 §3 (rfc-tm-7-diamond.md, S-CI-2) — the mise-pinned wasm
      # toolchain (tree-sitter CLI + wasi-sdk, per root mise.toml) is
      # installed by the composite action below, same shape as
      # .gitea/workflows/deploy-static-site.yml. The extension currently
      # depends on the published @sammons/typed-mind (not the workspace
      # build), so this is a no-op today; it makes the pipeline structurally
      # ready for TM-5 Q2/Q3's bundle-lsp wiring, which will build
      # @sammons/typed-mind-lsp (and transitively @sammons/typed-mind) from
      # the local workspace instead.
      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build TypedMind packages
        run: |
          # Build only the extension and its dependencies
          cd lib/typed-mind-vscode-extension
          mise exec -- pnpm run build

      # A committed lib/typed-mind-vscode-extension/lsp-bundled/ can drift from
      # what the pinned toolchain produces (PR #138) because nothing forced a
      # rebuild before packaging — vsce packages whatever bytes are on disk,
      # not what the LSP source currently compiles to. Rebuilding here and
      # then asserting a clean tree makes a stale-bundle publish fail loudly
      # instead of silently shipping bytes CI never validated.
      #
      # @sammons/typed-mind's grammar.wasm is gitignored and produced only by
      # its own prebuild script (scripts/build-wasm.mjs), which fires only
      # when `pnpm run build` runs scoped to that package. build:bundled-all
      # (root package.json, from PR #145) builds @sammons/typed-mind-lsp's
      # bundle and the extension's lsp-bundled/ copy, but does NOT build
      # @sammons/typed-mind first — its own onSuccess hook only copies
      # grammar.wasm, it does not build it. Skipping this step makes the next
      # one throw BundledWasmCopyError / an unresolved-module error on a
      # clean checkout.
      - name: Build core TypedMind package (produces grammar.wasm + dist)
        run: mise exec -- pnpm --filter @sammons/typed-mind run build

      - name: Rebuild bundled LSP for the extension
        run: mise exec -- pnpm run build:bundled-all

      # check:bundled-wasm (byte-exact sha256 against the canonical rebuilt
      # grammar.wasm and the installed web-tree-sitter.wasm) and
      # check:clean-tree (git status --porcelain=v1 over every tracked file)
      # together supersede a hand-rolled porcelain diff scoped to just these
      # two directories — check:clean-tree's scope is a strict superset, and
      # check:bundled-wasm verifies content correctness, not just "git saw a
      # change." Both scripts landed on main via PR #145.
      - name: Verify bundled LSP output matches the committed tree
        run: |
          mise exec -- pnpm run check:bundled-wasm
          mise exec -- pnpm run check:clean-tree

      - name: Package extension
        run: |
          cd lib/typed-mind-vscode-extension




          # Package the extension
          mise exec -- pnpm --filter typed-mind exec vsce package --no-dependencies
          
          # Verify VSIX was created
          VSIX_FILE=$(ls *.vsix | head -1)
          if [ -z "$VSIX_FILE" ]; then
            echo "Error: No VSIX file created"
            exit 1
          fi
          
          echo "Created $VSIX_FILE"
          echo "VSIX_FILE=$VSIX_FILE" >> $GITHUB_ENV
          
          cd ../..

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: vscode-extension-vsix
          path: lib/typed-mind-vscode-extension/*.vsix
          retention-days: 7

  publish:
    name: Publish to Marketplace
    needs: [validate, build]
    if: needs.validate.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: vscode-marketplace
      url: https://marketplace.visualstudio.com/items?itemName=Sammons.typed-mind
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Download VSIX
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: vscode-extension-vsix
          path: ./artifacts

      - name: Publish extension
        if: ${{ github.event.inputs.dry_run != 'true' || github.event.inputs.dry_run == '' || github.event.inputs.dry_run == null }}
        run: |
          VSIX_FILE=$(find ./artifacts -name "*.vsix" | head -1)

          if [ -z "$VSIX_FILE" ]; then
            echo "Error: No VSIX file found"
            exit 1
          fi

          # pnpm --filter typed-mind exec runs vsce with cwd set to
          # lib/typed-mind-vscode-extension, so a path relative to the
          # repo root (where this step's find above resolves it) no
          # longer points at the artifact. Resolve to an absolute path
          # before handing it to --packagePath.
          VSIX_FILE=$(realpath "$VSIX_FILE")

          echo "Publishing $VSIX_FILE..."
          
          if [[ "${{ github.event.inputs.prerelease }}" == "true" ]]; then
            mise exec -- pnpm --filter typed-mind exec vsce publish --pre-release --pat "${{ secrets.VSCE_PAT }}" --packagePath "$VSIX_FILE"
          else
            mise exec -- pnpm --filter typed-mind exec vsce publish --pat "${{ secrets.VSCE_PAT }}" --packagePath "$VSIX_FILE"
          fi

      - name: Dry run summary
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          VSIX_FILE=$(find ./artifacts -name "*.vsix" | head -1)
          echo "Dry run mode - would have published: $VSIX_FILE"
          
          # Show package details
          unzip -l "$VSIX_FILE" | head -20

      - name: Verify publication
        if: ${{ github.event.inputs.dry_run != 'true' || github.event.inputs.dry_run == '' || github.event.inputs.dry_run == null }}
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          EXTENSION_ID="sammons.typed-mind"

          echo "Waiting for extension to be available on marketplace..."

          # vsce's own publish output says the marketplace "might take a few
          # minutes" to index a new version (observed ~6 minutes on run
          # 33751628608). Poll with a fixed 60s backoff instead of the
          # previous 30x10s=5min budget, which was short by exactly the
          # margin that run needed.
          MAX_ATTEMPTS=12
          ATTEMPT=1

          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "Checking marketplace (attempt $ATTEMPT/$MAX_ATTEMPTS)..."

            if mise exec -- pnpm --filter typed-mind exec vsce show "$EXTENSION_ID" --json 2>/dev/null | jq -e ".versions[] | select(.version == \"$VERSION\")" > /dev/null 2>&1; then
              echo "✓ Extension $EXTENSION_ID@$VERSION is now available on marketplace"
              exit 0
            fi

            if [ "$ATTEMPT" -eq "$MAX_ATTEMPTS" ]; then
              break
            fi

            sleep 60
            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "Error: $EXTENSION_ID@$VERSION did not appear on the marketplace after $MAX_ATTEMPTS attempts (60s apart)"
          exit 1

  summary:
    name: Publishing Summary
    needs: [validate, build, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate summary
        run: |
          echo "## VS Code Extension Publishing Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Version Information" >> $GITHUB_STEP_SUMMARY
          echo "- Version: ${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Extension ID: sammons.typed-mind" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.validate.outputs.should_publish }}" != "true" ]]; then
            echo "ℹ️ Extension version already exists on marketplace - skipped publishing" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            echo "ℹ️ Dry run completed - no actual publishing performed" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.publish.result }}" == "success" ]]; then
            echo "✅ Successfully published extension to VS Code Marketplace" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "[View on Marketplace](https://marketplace.visualstudio.com/items?itemName=sammons.typed-mind)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Publishing failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ github.event.inputs.prerelease }}" == "true" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "ℹ️ Published as pre-release version" >> $GITHUB_STEP_SUMMARY
          fi