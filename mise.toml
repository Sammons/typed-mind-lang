[tools]
node = "24" # floor inherited from frozen goal scope S-CORE-3 (engines.node >= 24.0.0); not re-litigated here
tree-sitter = "0.26.13"            # resolves via aqua:tree-sitter/tree-sitter

[tools."http:wasi-sdk"]
version = "29.0"
strip_components = 1

[tools."http:wasi-sdk".platforms]
linux-x64   = { url = "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-29/wasi-sdk-29.0-x86_64-linux.tar.gz",  checksum = "sha256:87d1d1a2879d139cdc624b968efad3d4a97b8078cdff95e63ac88ecafd1a0171" }
linux-arm64 = { url = "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-29/wasi-sdk-29.0-arm64-linux.tar.gz",   checksum = "sha256:052ad773397dc9e5aa99fb4cfef694175e6b1e81bb2ad1d3c8e7b3fc81441b7c" }
macos-arm64 = { url = "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-29/wasi-sdk-29.0-arm64-macos.tar.gz",   checksum = "sha256:e11552913e3f99e834d7fe7da1bd081abaf764759ed76b6097a34c63fc83665e" }

# Paired-bump procedure: the tree-sitter CLI, wasi-sdk, and (from TM-3) web-tree-sitter bump only
# together, in a single PR. Steps: (1) bump the CLI pin above; (2) copy the new tag's
# crates/loader/wasi-sdk-version value into the wasi-sdk `version` above; (3) update each platform's
# URL to the new tag and recompute its sha256 from a fresh download; (4) cross-check each new
# checksum against the GitHub Releases API digest (curl -s
# https://api.github.com/repos/WebAssembly/wasi-sdk/releases/tags/wasi-sdk-<major> | python3 -c
# "...assets[].digest..." ) — a mismatch blocks the bump, this is not TOFU; (5) bump
# web-tree-sitter's exact pin in package.json; (6) regenerate parser.c/grammar.json/node-types.json
# and the S-AST-2 src/ast/gen/ wrappers; (7) pass the wasm load smoke test (pnpm run check:toolchain).
# See README "Development" for the full narrative. RFC-TM-1 (rfc-tm-1-diamond.md).
