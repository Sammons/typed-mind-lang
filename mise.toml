[tools]
node = "26" # bumped from 24 → 26 for native type stripping, stable node:sqlite, Temporal
# Node 26 no longer ships corepack (nodejs/node#57617, #59835), so pnpm comes
# from mise's own pnpm backend rather than `corepack prepare`. This is the
# single source of truth for the pnpm version across all three CI surfaces
# (.github/actions/setup-node-pnpm, .gitea/workflows/ci.yml,
# .gitea/workflows/deploy-static-site.yml). Keep in sync with package.json's
# `packageManager` field — scripts/check-toolchain.mjs asserts the two match.
pnpm = "11.15.1"
tree-sitter = "0.27.0"            # resolves via aqua:tree-sitter/tree-sitter

[tools."http:wasi-sdk"]
version = "34.0"
strip_components = 1

[tools."http:wasi-sdk".platforms]
linux-x64   = { url = "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz",  checksum = "sha256:b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4" }
linux-arm64 = { url = "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-arm64-linux.tar.gz",   checksum = "sha256:f7e243dff54d60bcc576e94d6166b69f410f2500ae4a9ceef34315be10e77971" }
macos-arm64 = { url = "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-arm64-macos.tar.gz",   checksum = "sha256:9c59398106b417f8f14913380fdf0097a8cc0ff4af9eb3ce0065a859e88d49e9" }

# Paired-bump procedure: the tree-sitter CLI, wasi-sdk, and (from TM-3) web-tree-sitter bump only
# together, in a single PR. Steps: (1) bump the CLI pin above; (2) copy the new tag's
# crates/loader/wasi-sdk-version value into the wasi-sdk `version` above; (3) update each platform's
# URL to the new tag and recompute its sha256 from a fresh download; (4) cross-check each new
# checksum against the GitHub Releases API digest (curl -s
# https://api.github.com/repos/WebAssembly/wasi-sdk/releases/tags/wasi-sdk-<major> | python3 -c
# "...assets[].digest..." ) — a mismatch blocks the bump, this is not TOFU; (5) bump
# web-tree-sitter's exact pin in package.json; (6) regenerate parser.c/grammar.json/node-types.json
# and the S-AST-2 src/ast/gen/ wrappers; (7) pass the wasm load smoke test (pnpm run check:toolchain).
# See README "Development" for the full narrative. RFC-TM-1 (rfc-tm-1-diamond.md).
